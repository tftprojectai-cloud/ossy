name: Deploy SolidCraft Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.18.2/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C /usr/local/bin

      - name: Build SolidCraft Web Main App
        run: |
          cd apps/solidcraft-web
          # ลบไฟล์การตั้งค่า Trunk เดิมออกเพื่อไม่ให้มันบังคับ path ผิด
          rm -f Trunk.toml
          trunk build --release --dist dist --public-url "/ossy/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/solidcraft-web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
